version: 2
registries:
  leakprobe-docker:
    type: docker-registry
    url: https://ghcr.io
  leakprobe-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
updates:
  - package-ecosystem: docker
    directory: /
    registries: [leakprobe-docker]
    schedule: {interval: daily}
  - package-ecosystem: npm
    directory: /
    registries: [leakprobe-npm]
    schedule: {interval: daily}
